  <script type="application/json" data-editable-activity>{"activity": {"kind": "open-ended", "sectionType": "activity_open_ended", "enabled": true, "steps": [{"id": "step-6", "prompt": {"text": "Rejea Kazi ya kufanya namba 11:\n\n(a) Chora maumbo mbalimbali kwa kubadilisha thamani ya pande. Badilisha namba ya pande kuwa 4, 5, 6, 7 na 8.\n\n(b) Je, mbali na kubadili idadi ya pande, maboresho gani zaidi unaweza kufanya kwenye kazi ya kufanya ya 11?\n\n(c) Unda programu ya Scratch ichore mstari wa zigizaga.", "dataId": "pg086_n0090"}, "ariaId": "aria-6", "multiline": true}, {"id": "step-7", "prompt": {"text": "(a) Chagua kihusika cha mvulana kutoka kwenye vihusika vilivyopo.\n\n(b) Badilisha mandhari ya nyuma yaliyopo kuwa mandhari ya chumba cha kulala.\n\n(c) Badilisha mandhari ya nyuma kuwa yale ya sherehe ya kuzaliwa.", "dataId": "pg086_n0092"}, "ariaId": "aria-7", "multiline": true}, {"id": "step-8", "prompt": {"text": "Umepewa msimbo kwa maelezo, badilisha kuwa msimbo wa Scratch au Quorum.\n\nWakati bendera ya kijani inapobonyezwa.\n1) Uliza: Weka namba ya kwanza, na subiri.\n2) Weka kibadilika a kiwe jibu.\n3) Uliza: Weka namba ya pili, na subiri.\n4) Weka kibadilika b kiwe jibu.\n5) Sema zao la a na b.", "dataId": "pg087_n0031"}, "ariaId": "aria-8", "multiline": true}, {"id": "step-9", "prompt": {"text": "Fanya maboresho ya kazi ya kufanya namba 10.\n\nTumia digrii 2, 3, 4, na 5 kuchora duara.", "dataId": "pg087_n0033"}, "ariaId": "aria-9", "multiline": true}, {"id": "step-10", "prompt": {"text": "Mashaka alikuwa na machungwa 27.\n\nAligawa machungwa hayo kwa usawa kwa marafiki zake watatu.\n\nTumia programu ya Scratch kutafuta idadi ya machungwa ambayo kila rafiki wa Mashaka alipokea.\n\nUnda kazimradi rahisi itakayofanya kazi hiyo na mabadiliko tofauti ya namba.", "dataId": "pg087_n0035"}, "ariaId": "aria-10", "multiline": true}, {"id": "step-11", "prompt": {"text": "Unda mchezo wa maswali na majibu kuhusu mada/somo lolote ambao ni wa kufurahisha na kushirikisha mtumiaji.\n\nHivyo, mchezo uwe wa kuuliza na kutoa mrejesho kama jibu ni sahihi au si sahihi.", "dataId": "pg087_n0037"}, "ariaId": "aria-11", "multiline": true}, {"id": "step-12a", "prompt": {"text": "Ni maumbo gani yanawasilishwa bloku za msimbo zifuatazo?\n\nBloku ei ina bendera ya Kijani, alama ya ficha, kalamu ya futa yote, kalamu juu na rangi ya kalamu. Pia kuna maagizo ya kwenda kwenye x sifuri na y sifuri, zunguka digrii tisini, kalamu chini na rudia mara nne. Pia inaelekeza kwenda hatua mia moja na kuzunguka digrii tisini mara nne.", "dataId": "pg087_n0039"}, "image": {"imageId": "pg085_im003", "src": "images/pg087_im001.png", "alt": "Bloku za Scratch: wakati bendera inapobonyezwa, ficha, futa yote, kalamu juu, weka rangi kuwa 5, enda x 0 y 0, zunguka digrii 90, kalamu chini, rudia mara 24: rudia mara 4 songa hatua 100 na zunguka digrii 90; kisha zunguka digrii 15."}, "ariaId": "aria-12a", "multiline": true}, {"id": "step-12b", "prompt": {"text": "Ni maumbo gani yanawasilishwa bloku za msimbo zifuatazo?\n\nBloku bii ina bendera ya Kijani, kalamu ya futa yote, kalamu chini, zunguka digrii thelathini, enda kwa mahali popote, milele, songa hatua kumi, ikiwa kwenye ukingo wa jukwaa rejesha na badilisha rangi kwa moja.", "dataId": "pg087_n0041"}, "image": {"imageId": "pg085_im004", "src": "images/pg087_im002.png", "alt": "Bloku za Scratch: wakati bendera inapobonyezwa, futa yote, kalamu chini, zunguka digrii 30, enda mahali popote; milele songa hatua 10, ukifika ukingoni rudi, na badilisha rangi ya kalamu kwa 1."}, "ariaId": "aria-12b", "multiline": true}]}, "palette": {"surface": "#FFFFFF", "ink": "#000000", "accent": "#1E40AF", "accentSoft": "rgba(30, 64, 175, 0.16)", "headerText": "#FFFFFF", "body": "#E0E4F4", "optionFill": "#EFF2F9", "submit": "#6D83CB", "submitText": "#FFFFFF", "optionText": "#000000", "selectedText": "#1E40AF"}}</script>
